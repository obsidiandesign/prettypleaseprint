# CI — every pull request and every push to main.
#
# Three independent gates, so branch protection can require them by name:
#
#   guard    — typecheck, the secret scanner over the whole tree, and the
#              documentation link checker. Cheap and first: a leaked
#              credential should fail in seconds, not after a six-minute
#              integration run.
#   verify   — raises the REAL compose stack from source and runs every
#              suite against the built image, including the WebAuthn
#              ceremonies in a headless Chrome. This is the one that
#              matters: it exercises the artifact the release workflow
#              publishes, not a `next dev` approximation.
#   trivy    — filesystem scan; HIGH/CRITICAL fail the run.
#
# `verify` deliberately uses docker compose rather than GitHub `services:`.
# Running the same command a developer runs means the compose files themselves
# are under test. A broken overlay fails here rather than on the NAS.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # The daily traffic snapshot writes only here. Rebuilding the whole stack
    # for a row of numbers would burn twenty minutes a day and republish
    # byte-identical images.
    paths-ignore:
      - "docs/traffic/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    # A bare Postgres for the migration check only: it needs an empty scratch
    # database to replay migrations onto, not the application stack, so the
    # compose-based `verify` job below is not the place for it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ppp
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ppp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      # ESLint with warnings counted as failures, so the baseline stays at zero
      # and a new warning is a decision rather than noise nobody reads.
      - name: Lint
        run: npm run lint
      # Replays every migration onto an empty database and diffs the result
      # against schema.prisma. A schema edit with no migration, or a hand-written
      # migration that differs from the schema, passes typecheck and every
      # suite below (they build the database from the migrations, never compare
      # it to the schema) and then fails on the NAS.
      - name: Migrations match the schema
        env:
          DATABASE_URL: postgresql://ppp:ci-only-not-a-secret@localhost:5432/ppp
          SHADOW_DATABASE_URL: postgresql://ppp:ci-only-not-a-secret@localhost:5432/ppp_shadow
        run: |
          PGPASSWORD=ci-only-not-a-secret psql -h localhost -U ppp -d ppp -c 'CREATE DATABASE ppp_shadow'
          npm run check:migrations
      # Every environment variable the code reads is in the README table and in
      # every example env file, nothing documented is unused, and prose that
      # still says "only PLA" fails. None of that breaks a typecheck or a
      # suite; it breaks the person deploying from the docs.
      - name: Configuration is documented
        run: npm run check:config-docs
      # Pure-function checks — no database, no Bambuddy, no server. Cheap
      # enough to run before any of that exists.
      - name: Pure-function checks (scope, dedup, model-file validation)
        run: npm run verify:lib
      # Cross-checks every tracked file against known credential shapes. In CI
      # there are no local .env files, so the value-matching pass has nothing
      # to compare against and only the pattern pass runs — which is exactly
      # the half that catches a secret someone typed straight into a file.
      - name: Secret scan
        run: npm run check:secrets -- --all
      # Documentation links rot silently — no test, build or typecheck notices.
      # This repo has proved it twice: once moving the narrative into docs/,
      # once renaming a directory out from under references into it.
      - name: Documentation links
        run: npm run check:links

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      # Throwaway credentials, generated per run. Nothing here is a secret:
      # the stack lives for the length of this job and is never reachable from
      # outside the runner.
      - name: Compose environment
        run: |
          cp .env.docker.example .env.docker
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "ADMIN_EMAIL=ci-admin@example.test"
            echo "ADMIN_NAME=Ruben Haas"
          } >> .env.docker

      - name: Raise the stack
        run: |
          docker compose --env-file .env.docker \
            -f docker-compose.prod.yml -f docker-compose.build.yml \
            -f docker-compose.test.yml --profile mailcatcher up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -m 3 http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the app never became healthy"
          docker compose --env-file .env.docker -f docker-compose.prod.yml \
            -f docker-compose.build.yml -f docker-compose.test.yml logs --tail=80
          exit 1

      # The host-side suites read .env; the stack's credentials are generated.
      - name: Point the suites at the stack
        run: npm run env:container

      # Business logic against a fake Bambuddy this suite brings up itself
      # (on its own `next dev`, pointed at the fake — the compose stack's own
      # BAMBUDDY_URL isn't reachable here, so nothing above exercises this).
      # Covers the exact Declined/Failed split that shipped wrong once, this
      # time through the real HTTP/DB wiring rather than the pure function
      # alone (see verify:lib).
      - name: Intake and sync, against a fake Bambuddy
        run: npm run verify:intake
      - name: Invite and sign-in flow
        run: npm run verify:auth
      - name: Admin queue, decline, flag, withdraw, re-queue
        run: npm run verify:queue
      # The 'frr' feature-request track — the same board/queue/scope mechanics
      # as prints, on its own tables, with a status the owner steps forward by
      # hand. Drives the real forms exactly as verify:queue.
      - name: Feature requests, filed and triaged
        run: npm run verify:frr
      # Owner-managed benefits (the tip catalogue): admin CRUD, and that a past
      # request keeps its tip after the benefit behind it is edited or deleted.
      - name: Benefits, owner-managed
        run: npm run verify:benefits
      # The second front door onto the same operations. Runs against the built
      # image, which is the only place the production CSP is in force — the
      # console's inline-script nonce and its stylesheet-in-a-file are both
      # things that render a page either way and only *work* under that policy.
      - name: The JSON API, the OpenAPI document and the console
        run: npm run verify:api

      # Registering and using a passkey is a browser ceremony — it cannot be
      # tested with fetch. The runner ships Chrome; a CDP virtual authenticator
      # supplies the hardware. Without this, nothing in CI covers the primary
      # way people are meant to sign in.
      - name: WebAuthn ceremonies (real browser)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:passkey

      - name: OWASP-mapped security probes
        run: npm run probe:security

      # Regression pins for the 2026-08-23 finding: node's base image bundles
      # npm, npm bundles sigstore 3.1.0 (CVE-2026-48815), and neither image
      # needs npm at runtime. If someone reintroduces it — an `npx` in a CMD,
      # a global install — the HIGH comes straight back. Fail here, loudly,
      # rather than on the next daily image scan.
      - name: Runtime images ship no npm
        run: |
          for img in ppp-app ppp-migrate; do
            if docker run --rm --entrypoint sh "ghcr.io/danileau/$img:latest"                  -c 'command -v npm' >/dev/null 2>&1; then
              echo "::error file=Dockerfile::npm is back in $img — it re-adds the vulnerable bundled sigstore"
              exit 1
            fi
          done
          echo "neither image ships npm"

      # And the migrator must still be able to do its job without it, which is
      # the half a presence check cannot tell you.
      - name: Migrator still runs without npm
        run: |
          docker run --rm --entrypoint sh ghcr.io/danileau/ppp-migrate:latest             -c './node_modules/.bin/prisma --version >/dev/null && ./node_modules/.bin/tsx --version >/dev/null'             && echo "prisma and tsx resolve via node_modules/.bin"

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.docker -f docker-compose.prod.yml \
            -f docker-compose.build.yml -f docker-compose.test.yml logs --tail=200

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan (HIGH/CRITICAL fail)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Dockerfile and compose misconfigurations, and any committed
          # secret, gate the build too — not only dependency CVEs.
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
