## Pretty Please Print behind SWAG.
##
## Copy to SWAG's config: /mnt/user/appdata/swag/nginx/proxy-confs/
## then change `print` below to your subdomain and restart SWAG. The
## subdomain must also be in SWAG's SUBDOMAINS (or covered by a wildcard
## cert). Walkthrough: docs/unraid.md.
##
## The app container must be on the same Docker network as SWAG (see
## PPP_PROXY_NETWORK) so `ppp-app` resolves by name.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name print.*;

    include /config/nginx/ssl.conf;

    # Requests are text (a link, a note, a comment); the app itself caps a
    # body at 10 MB, so nothing legitimate is bigger.
    client_max_body_size 10m;

    # The sync is called from inside the container (deploy/unraid/sync.sh), so
    # nothing outside ever needs it. It is bearer-protected anyway; this just
    # keeps it off the internet entirely.
    location = /api/cron/sync {
        return 404;
    }

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app ppp-app;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
