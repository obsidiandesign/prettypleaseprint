services:
  db:
    image: postgres:17-alpine
    container_name: ppp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppp
      POSTGRES_PASSWORD: dev-only-not-a-secret
      POSTGRES_DB: ppp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppp -d ppp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outbound email in dev. Web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ppp-mailpit
    restart: unless-stopped
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
